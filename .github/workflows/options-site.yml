name: Options site checks and deployment
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "dashboard/dist/**"
      - "options_site/**"
      - ".github/workflows/options-site.yml"
permissions:
  contents: read
concurrency:
  group: options-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: "22"
      - run: node options_site/check.mjs
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger and verify the Cloudflare production build
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_DEPLOY_HOOK"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer main commit superseded this run."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 -X POST "$CLOUDFLARE_DEPLOY_HOOK" \
            | jq -e '.success == true' >/dev/null
          for attempt in $(seq 1 48); do
            if curl --fail --silent --max-time 8 https://btcopt.pages.dev/version.json \
                | jq -e --arg expected "$GITHUB_SHA" '.commit == $expected' >/dev/null; then
              curl --fail --silent --show-error --max-time 8 https://btcopt.pages.dev/api/health \
                | jq -e '.status == "ok"' >/dev/null
              echo "Production serves $GITHUB_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not serve $GITHUB_SHA before the deadline." >&2
          exit 1
